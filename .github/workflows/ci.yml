name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: macos-latest
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Style
        run: brew style --cask innovai-labs/tap/peek

      # --online downloads the DMG, so a wrong sha256 or a dead URL fails here.
      - name: Audit
        run: brew audit --cask --online --strict innovai-labs/tap/peek

      - name: Livecheck
        run: brew livecheck --cask innovai-labs/tap/peek
